[project]
name = "ytdl-cli"
version = "0.1.0"
description = "Download YouTube videos as MP3 or MP4, one at a time or in bulk from a CSV file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.2",
    "yt-dlp[default]>=2026.11.23",
]

[project.scripts]
ytdl = "ytdl.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ytdl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
# Everything, tests included, gets these checks...
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
extra_checks = true

[[tool.mypy.overrides]]
# ...and the package itself must also be fully annotated.
module = ["ytdl", "ytdl.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# yt-dlp ships without type hints.
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
